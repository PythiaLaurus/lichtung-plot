[package]
name = "lichtung-plot"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Strongly typed scientific plotting with deterministic SVG and optional PNG output"
documentation = "https://docs.rs/lichtung-plot"
readme = "README.md"
publish = false
autotests = false

[features]
default = []
text-as-path = ["dep:resvg"]
png = ["text-as-path", "dep:png", "dep:zune-jpeg"]

[dependencies]
polars = { version = "0.54", features = ["dtype-i128", "dtype-u128"] }
statrs = "0.18"
thiserror = "2"
unicode-segmentation = "1.13"
# `resvg` outlines SVG text and, with the `png` feature, rasterizes the native
# SVG output. Pure Rust, with no external renderer process.
png = { version = "0.18", optional = true }
resvg = { version = "0.47.0", features = ["text"], optional = true }
# zune-jpeg 0.5.15's no-log warning macro does not compile on the supported toolchain.
zune-jpeg = { version = "=0.5.15", features = ["log"], optional = true }

[dev-dependencies]
insta = "1.48"

[[test]]
name = "annotations"
path = "tests/annotations/suite.rs"

[[test]]
name = "categorical"
path = "tests/categorical/suite.rs"

[[test]]
name = "composition"
path = "tests/composition/suite.rs"

[[test]]
name = "distributions"
path = "tests/distributions/suite.rs"

[[test]]
name = "estimates"
path = "tests/estimates/suite.rs"

[[test]]
name = "heatmap"
path = "tests/heatmap/suite.rs"

[[test]]
name = "interactions"
path = "tests/interactions/suite.rs"

[[test]]
name = "layout"
path = "tests/layout/suite.rs"

[[test]]
name = "lines"
path = "tests/lines/suite.rs"

[[test]]
name = "marginal-matrix"
path = "tests/marginal_matrix/suite.rs"

[[test]]
name = "output"
path = "tests/output/suite.rs"

[[test]]
name = "rendering"
path = "tests/rendering/suite.rs"

[[test]]
name = "statistics"
path = "tests/statistics/suite.rs"

[[test]]
name = "visual-regression"
path = "tests/visual_regression/suite.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
