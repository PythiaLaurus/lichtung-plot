[workspace]
members = ["crates/lichtung-plot"]
default-members = ["crates/lichtung-plot"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fontdb = "=0.23.0"
num-bigint = "=0.4.8"
rustybuzz = "=0.20.1"
sha2 = "=0.10.9"
statrs = "0.18"
thiserror = "2"
ttf-parser = "=0.25.1"
unicode-bidi = "=0.3.18"
unicode-properties = "=0.1.3"
unicode-script = "=0.5.7"
unicode-segmentation = "=1.12.0"
# Lichtung SVGs contain no raster images, so resvg's JPEG, GIF, and WebP
# decoders are deliberately disabled.
png = "0.18"
# Text is already outlined by the canonical renderer; no SVG font engine.
resvg = { version = "0.47.0", default-features = false }
tempfile = "3.27"
fontconfig-parser = "=0.5.8"
roxmltree = "=0.20.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# Assert the actual tables shared with rustybuzz, not only its package version.
unicode-ccc = "=0.4.0"
unicode-bidi-mirroring = "=0.4.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
