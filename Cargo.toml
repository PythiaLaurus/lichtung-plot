[package]
name = "lichtung-plot"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Strongly typed scientific plotting with deterministic SVG and PNG output"
documentation = "https://docs.rs/lichtung-plot"
readme = "README.md"
publish = false
autotests = false

[dependencies]
fontdb = "=0.23.0"
rustybuzz = "=0.20.1"
sha2 = "=0.10.9"
statrs = "0.18"
thiserror = "2"
ttf-parser = "=0.25.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.7"
unicode-segmentation = "=1.12.0"
# Lichtung SVGs contain no raster images, so resvg's JPEG, GIF, and WebP
# decoders are deliberately disabled.
png = "0.18"
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
tempfile = "3.27"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
fontconfig-parser = "=0.5.8"
roxmltree = "=0.20.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
insta = "1.48"

[[test]]
name = "annotations"
path = "tests/annotations/suite.rs"

[[test]]
name = "categorical"
path = "tests/categorical/suite.rs"

[[test]]
name = "composition"
path = "tests/composition/suite.rs"

[[test]]
name = "distributions"
path = "tests/distributions/suite.rs"

[[test]]
name = "estimates"
path = "tests/estimates/suite.rs"

[[test]]
name = "heatmap"
path = "tests/heatmap/suite.rs"

[[test]]
name = "interactions"
path = "tests/interactions/suite.rs"

[[test]]
name = "layout"
path = "tests/layout/suite.rs"

[[test]]
name = "lines"
path = "tests/lines/suite.rs"

[[test]]
name = "marginal-matrix"
path = "tests/marginal_matrix/suite.rs"

[[test]]
name = "output"
path = "tests/output/suite.rs"

[[test]]
name = "rendering"
path = "tests/rendering/suite.rs"

[[test]]
name = "statistics"
path = "tests/statistics/suite.rs"

[[test]]
name = "visual-regression"
path = "tests/visual_regression/suite.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
