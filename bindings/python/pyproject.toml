[build-system]
requires = [
    "maturin==1.16.0",
    "tomli==2.5.0; python_version < '3.11'",
]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "lichtung-plot"
dynamic = ["version"]
description = "Native scientific plots with reusable Python configuration owners"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "licenses/THIRD-PARTY-NOTICES.txt", "licenses/RUST-LIBRARY-LICENSE.html"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/PythiaLaurus/lichtung-plot"
Documentation = "https://github.com/PythiaLaurus/lichtung-plot/tree/main/docs"
Issues = "https://github.com/PythiaLaurus/lichtung-plot/issues"
Changelog = "https://github.com/PythiaLaurus/lichtung-plot/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "lichtung_plot._native"
include = [
    { path = "_build_backend.py", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    { path = "tests/*.ini", format = "sdist" },
    { path = "examples/*.py", format = "sdist" },
]
