# Installed-wheel input gate: run outside the source package, checking the actual
# installed lichtung_plot declarations as explicit roots alongside the fixtures.
# Main selects --python-executable and --cache-dir; python_version is the typing
# language target, not a claim that mypy itself is running on CPython 3.10.
[mypy]
python_version = 3.10
strict = True
warn_unused_ignores = True
disallow_any_unimported = True
follow_imports = normal

# Without pandas-stubs, analyze the real installed pandas classes rather than
# replacing imports with Any. This verifies nominal input roles only if all
# positive cases and the bidirectional expected-error guards actually pass.
# It is not full pandas API/dtype typing or evidence for another provider/version.
[mypy-pandas,pandas.*]
follow_untyped_imports = True
